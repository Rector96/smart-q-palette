[[redirects]]
  from = "/share/:token"
  to = "/.netlify/functions/result-share?token=:token"
  status = 200
  force = true

[[redirects]]
  from = "/r/:code"
  to = "/.netlify/functions/referral-share?ref=:code"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
